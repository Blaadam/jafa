[package]
name = "jafa"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
fs_extra = "1.3.0"
include_dir = "0.7.4"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde"] }
owo-colors = "4.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
time = { version = "0.3.55", features = ["formatting"] }
