[package]
name = "jafa"
version = "2.1.0"
edition = "2024"
rust-version = "1.88"
description = "A CLI tool for Roblox repository management"
license = "ISC"
repository = "https://github.com/Blaadam/jafa"
keywords = ["roblox", "rojo", "mantle", "wally", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
include_dir = "0.7.4"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde"] }
owo-colors = "4.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
time = { version = "0.3.55", features = ["formatting"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
